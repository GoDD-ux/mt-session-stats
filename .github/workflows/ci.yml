name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['python:2.7-slim', 'python:3.12-slim']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  package:
    needs: [python, ui]
    runs-on: ubuntu-latest
    # .pyc для клиента собираются только интерпретатором 2.7
    container: python:2.7-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - run: python build.py --skip-ui
      - uses: actions/upload-artifact@v4
        with:
          name: mtmod
          path: dist/*.mtmod

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mtmod
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.mtmod'
